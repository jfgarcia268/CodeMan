<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeMan — tests</title>
<style>
  body { font-family: -apple-system, monospace; background: #1e1e1e; color: #ddd; padding: 20px; }
  .pass { color: #5dd35d; } .fail { color: #ff6b6b; font-weight: bold; }
  h1 { font-size: 18px; } .row { padding: 2px 0; font-size: 13px; }
  #summary { margin: 14px 0; font-size: 15px; }
</style>
</head>
<body>
<h1>CodeMan unit tests</h1>
<div id="summary">running…</div>
<div id="out"></div>

<!-- DOM skeleton app.js touches at parse time (so it loads without errors) -->
<div style="display:none">
  <div class="app"><div class="sidebar">
    <div class="sidebar-search"></div>
    <input id="searchInput"><span id="searchClear"></span><button id="deepSearchToggle"></button>
    <div id="searchCapNote" hidden></div>
    <div id="treeArea"><div id="tree"></div><div id="pageCol"></div></div>
    <div id="colCount"><div id="colCountOpts"></div></div>
    <button id="expandAllBtn"></button><button id="collapseAllBtn"></button>
    <div id="layoutToggle"></div><button id="hideSidebarBtn"></button>
  </div>
  <div id="sidebarResizer"></div><button id="showSidebarBtn"></button>
  <div class="main"><div id="mainTabs"></div><div id="pageHeader"></div><div id="page"></div></div></div>
</div>

<!-- Stub the backend + Prism so app.js init has no real side effects -->
<script>
  window.Prism = { highlightElement(){}, plugins:{} };
  window.fetch = (url) => Promise.resolve({ status:200, ok:true, json: async () => {
    const u = String(url);
    if (u.includes('action=tree')) return [];
    if (u.includes('action=get_page')) return { title:'', sections:[] };
    return { ok:true };
  }});
</script>
<!-- Real markdown-it (note-block renderer) — must load before editor.js builds its instance -->
<script src="vendor/markdown-it/markdown-it.min.js"></script>
<script src="src/core.js"></script>
<script src="src/tree.js"></script>
<script src="src/editor.js"></script>
<script src="src/features.js"></script>
<script src="src/ui.js"></script>
<script src="src/offline.js"></script>
<script src="src/init.js"></script>
<script>
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function t(name, got, want) {
    const ok = eq(got, want);
    ok ? pass++ : fail++;
    const d = document.createElement('div');
    d.className = 'row ' + (ok ? 'pass' : 'fail');
    d.textContent = (ok ? '✓ ' : '✗ ') + name + (ok ? '' : `  →  got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);
    out.appendChild(d);
  }

  // nameFromPath
  t('nameFromPath strips dir + .json', nameFromPath('a/b/c.json'), 'c');
  t('nameFromPath root file', nameFromPath('x.json'), 'x');

  // uniqueCopyName: pick a non-clashing "<stem> copy [N]" page name.
  t('uniqueCopyName no siblings', uniqueCopyName('Foo', new Set()), 'Foo copy');
  t('uniqueCopyName source exists', uniqueCopyName('Foo', new Set(['Foo'])), 'Foo copy');
  t('uniqueCopyName copy taken → copy 2', uniqueCopyName('Foo', new Set(['Foo', 'Foo copy'])), 'Foo copy 2');
  t('uniqueCopyName copy+2 taken → copy 3', uniqueCopyName('Foo', new Set(['Foo', 'Foo copy', 'Foo copy 2'])), 'Foo copy 3');
  t('uniqueCopyName strips trailing " copy"', uniqueCopyName('Foo copy', new Set(['Foo copy'])), 'Foo copy 2');
  t('uniqueCopyName strips trailing " copy N"', uniqueCopyName('Foo copy 2', new Set(['Foo copy 2'])), 'Foo copy');
  t('uniqueCopyName inner "copy" is not stripped', uniqueCopyName('My copy shop', new Set()), 'My copy shop copy');
  t('uniqueCopyName accepts an Array', uniqueCopyName('Foo', ['Foo']), 'Foo copy');

  // miniMenuWrapIndex: ArrowUp/Down index wrap for the accessible ⋯ menus.
  t('miniMenuWrapIndex mid-range unchanged', miniMenuWrapIndex(2, 5), 2);
  t('miniMenuWrapIndex first item', miniMenuWrapIndex(0, 5), 0);
  t('miniMenuWrapIndex last item', miniMenuWrapIndex(4, 5), 4);
  t('miniMenuWrapIndex past end wraps to 0', miniMenuWrapIndex(5, 5), 0);
  t('miniMenuWrapIndex before start wraps to last', miniMenuWrapIndex(-1, 5), 4);
  t('miniMenuWrapIndex far-negative wraps in range', miniMenuWrapIndex(-6, 5), 4);
  t('miniMenuWrapIndex empty menu → -1', miniMenuWrapIndex(0, 0), -1);
  t('miniMenuWrapIndex single item stays 0', miniMenuWrapIndex(1, 1), 0);

  // tabArrowIndex: ARIA tablist Left/Right/Home/End index math (Left/Right wrap).
  t('tabArrowIndex Right advances', tabArrowIndex('ArrowRight', 1, 4), 2);
  t('tabArrowIndex Right wraps last→first', tabArrowIndex('ArrowRight', 3, 4), 0);
  t('tabArrowIndex Left retreats', tabArrowIndex('ArrowLeft', 2, 4), 1);
  t('tabArrowIndex Left wraps first→last', tabArrowIndex('ArrowLeft', 0, 4), 3);
  t('tabArrowIndex Home → 0', tabArrowIndex('Home', 2, 4), 0);
  t('tabArrowIndex End → last', tabArrowIndex('End', 1, 4), 3);
  t('tabArrowIndex other key leaves index', tabArrowIndex('x', 2, 4), 2);
  t('tabArrowIndex no tabs → -1', tabArrowIndex('ArrowRight', 0, 0), -1);
  t('tabArrowIndex single tab Right stays 0', tabArrowIndex('ArrowRight', 0, 1), 0);

  // paletteArrowIndex: ArrowDown/Up highlight movement for the Move-to picker (clamps, no wrap).
  t('paletteArrowIndex Down advances', paletteArrowIndex('ArrowDown', 1, 4), 2);
  t('paletteArrowIndex Down clamps at last (no wrap)', paletteArrowIndex('ArrowDown', 3, 4), 3);
  t('paletteArrowIndex Up retreats', paletteArrowIndex('ArrowUp', 2, 4), 1);
  t('paletteArrowIndex Up clamps at first (no wrap)', paletteArrowIndex('ArrowUp', 0, 4), 0);
  t('paletteArrowIndex other key leaves index', paletteArrowIndex('x', 2, 4), 2);
  t('paletteArrowIndex empty list → -1', paletteArrowIndex('ArrowDown', 0, 0), -1);

  // focusTrapNextIndex: Tab / Shift-Tab cycling inside a modal focus trap (wraps).
  t('focusTrapNextIndex Tab advances', focusTrapNextIndex(1, 4, false), 2);
  t('focusTrapNextIndex Tab wraps last→first', focusTrapNextIndex(3, 4, false), 0);
  t('focusTrapNextIndex Shift-Tab retreats', focusTrapNextIndex(2, 4, true), 1);
  t('focusTrapNextIndex Shift-Tab wraps first→last', focusTrapNextIndex(0, 4, true), 3);
  t('focusTrapNextIndex not-in-list Tab → first', focusTrapNextIndex(-1, 4, false), 0);
  t('focusTrapNextIndex not-in-list Shift-Tab → last', focusTrapNextIndex(-1, 4, true), 3);
  t('focusTrapNextIndex empty → -1', focusTrapNextIndex(0, 0, false), -1);
  t('focusTrapNextIndex single item stays 0', focusTrapNextIndex(0, 1, false), 0);

  // collectFolderPaths: destination set for the "Move to…" picker (folders only,
  // depth-first, project flag carried; pages excluded).
  (function () {
    const tree = [
      { type: 'folder', path: 'A', project: false, children: [
        { type: 'page', path: 'A/p1' },
        { type: 'folder', path: 'A/B', project: true, children: [
          { type: 'page', path: 'A/B/p2' },
        ] },
      ] },
      { type: 'page', path: 'top' },
      { type: 'folder', path: 'C', children: [] },
    ];
    const got = collectFolderPaths(tree);
    t('collectFolderPaths finds every folder (excludes pages)', got.map(f => f.path).join(','), 'A,A/B,C');
    t('collectFolderPaths carries the project flag', got.find(f => f.path === 'A/B').project, true);
    t('collectFolderPaths non-project folder → false', got.find(f => f.path === 'A').project, false);
    t('collectFolderPaths missing project key → false', got.find(f => f.path === 'C').project, false);
    t('collectFolderPaths empty tree → []', collectFolderPaths([]).length, 0);
  })();

  // miniMenuHasCheck: does a menu reserve the icon column (any checkable row)?
  t('miniMenuHasCheck none checkable → false', miniMenuHasCheck([{ label: 'a' }, { label: 'b' }]), false);
  t('miniMenuHasCheck icon-only is not checkable', miniMenuHasCheck([{ icon: '★', label: 'a' }]), false);
  t('miniMenuHasCheck a checked:true row → true', miniMenuHasCheck([{ label: 'a' }, { label: 'b', checked: true }]), true);
  t('miniMenuHasCheck checked:false still counts (defined)', miniMenuHasCheck([{ label: 'a', checked: false }]), true);
  t('miniMenuHasCheck ignores dividers', miniMenuHasCheck([{ divider: true }, { label: 'a' }]), false);
  t('miniMenuHasCheck empty list → false', miniMenuHasCheck([]), false);

  // miniMenuClampPos: the anchorRect mode's viewport guard. Its defining property is
  // that it is a NO-OP while the box fits — the mode's contract is "plain position from
  // the caller's rect", so a fitting menu must land on exactly the pixel it used to.
  // Only a genuine overflow shifts it (never a flip: an anchorRect has no usable top).
  t('miniMenuClampPos leaves a fitting box untouched',
    miniMenuClampPos(227, 400, 200, 243, 1440, 900), { top: 227, left: 400 });
  t('miniMenuClampPos exact bottom fit is untouched (boundary)',
    miniMenuClampPos(657, 400, 200, 243, 1440, 900), { top: 657, left: 400 });
  t('miniMenuClampPos exact right fit is untouched (boundary)',
    miniMenuClampPos(100, 1240, 200, 100, 1440, 900), { top: 100, left: 1240 });
  t('miniMenuClampPos shifts a bottom overflow back inside (the 420px-tall window bug)',
    miniMenuClampPos(227, 400, 200, 243, 1440, 420), { top: 169, left: 400 });
  t('miniMenuClampPos shifts a right overflow back inside',
    miniMenuClampPos(100, 1300, 200, 100, 1440, 900), { top: 100, left: 1232 });
  t('miniMenuClampPos pins a box taller than the viewport to the pad',
    miniMenuClampPos(300, 400, 200, 800, 1440, 420), { top: 8, left: 400 });
  t('miniMenuClampPos pulls a negative origin to the pad',
    miniMenuClampPos(-30, -10, 200, 100, 1440, 900), { top: 8, left: 8 });
  t('miniMenuClampPos honours a caller-supplied pad',
    miniMenuClampPos(400, 0, 200, 100, 1440, 420, 20), { top: 300, left: 0 });

  // miniMenuShift: the same guard for the align:'right' mode (sidebar More ⋯), which
  // positions with left=r.right + translateX(-100%) — so the box's VISUAL left edge is
  // (r.right - width) and the clamp runs on the RENDERED rect, correcting by a delta.
  // Same defining property: a fitting menu must not move by a single pixel.
  t('miniMenuShift leaves a fitting right-aligned menu untouched',
    miniMenuShift(34, 119, 233, 277, 1440, 900), { dx: 0, dy: 0 });
  t('miniMenuShift left-overflow: sidebar at SIDEBAR_MIN pushes it off the left edge',
    miniMenuShift(34, -71, 233, 277, 1440, 900), { dx: 79, dy: 0 });
  t('miniMenuShift left-overflow: the 390px drawer-closed case',
    miniMenuShift(38, -276, 233, 277, 390, 700), { dx: 284, dy: 0 });
  t('miniMenuShift exact left fit is untouched (boundary)',
    miniMenuShift(34, 0, 233, 277, 1440, 900), { dx: 0, dy: 0 });
  t('miniMenuShift right-overflow shifts back inside',
    miniMenuShift(34, 1300, 233, 100, 1440, 900), { dx: -101, dy: 0 });
  t('miniMenuShift exact right fit is untouched (boundary)',
    miniMenuShift(34, 1207, 233, 100, 1440, 900), { dx: 0, dy: 0 });
  t('miniMenuShift bottom-overflow shifts up (both axes at once)',
    miniMenuShift(34, -71, 233, 277, 1440, 300), { dx: 79, dy: -19 });

  // Duplicate deep-copy + insert-below: the copy lands at idx+1 and is independent.
  {
    const arr = [{ code: 'a' }, { code: 'b' }];
    arr.splice(0 + 1, 0, JSON.parse(JSON.stringify(arr[0])));
    arr[0].code = 'MUTATED';
    t('dup copy sits at idx+1', arr[1].code, 'a');
    t('dup copy is independent of source', arr[2] === undefined ? 'b' : arr[2].code, 'b');
    t('dup source mutate does not touch copy', arr[1].code, 'a');
    t('dup array length grew by one', arr.length, 3);
  }

  // Section duplicate: RAW clone preserves the legacy {tabs:[]} shape + retitles.
  {
    const src = { title: 'S', tabs: [{ blocks: [] }] };
    const copy = JSON.parse(JSON.stringify(src));
    copy.title = (src.title || 'Section') + ' copy';
    t('section dup keeps legacy .tabs', Array.isArray(copy.tabs), true);
    t('section dup title gets " copy"', copy.title, 'S copy');
    t('section dup does not mutate source title', src.title, 'S');
  }

  // assembleRestoredTabs: pure rebuild of restored tabs in SAVED ORDER from
  // already-resolved get_page results (fetch-timing independent). Uses throwaway
  // objects per assertion since the helper mutates data.sections/_mtime.
  {
    // 1. Order preserved regardless of result availability (map populated in reverse).
    const savedOrd = { tabs: [{ path: 'A.json' }, { path: 'B.json' }, { path: 'C.json' }], active: 'A.json' };
    const existOrd = new Set(['A.json', 'B.json', 'C.json']);
    const mapOrd = new Map();
    mapOrd.set('C.json', { sections: [] }); mapOrd.set('B.json', { sections: [] }); mapOrd.set('A.json', { sections: [] });
    t('assembleRestoredTabs keeps saved order regardless of result timing',
      assembleRestoredTabs(savedOrd, existOrd, p => mapOrd.get(p)).tabs.map(x => x.path), ['A.json', 'B.json', 'C.json']);
    // 2. Skip non-existent — B missing from tree.
    const savedNE = { tabs: [{ path: 'A.json' }, { path: 'B.json' }, { path: 'C.json' }], active: 'A.json' };
    t('assembleRestoredTabs skips non-existent, order intact',
      assembleRestoredTabs(savedNE, new Set(['A.json', 'C.json']), () => ({ sections: [] })).tabs.map(x => x.path), ['A.json', 'C.json']);
    // 3. Skip {error} — B failed to load.
    const savedErr = { tabs: [{ path: 'A.json' }, { path: 'B.json' }, { path: 'C.json' }], active: 'A.json' };
    t('assembleRestoredTabs skips {error} result',
      assembleRestoredTabs(savedErr, new Set(['A.json', 'B.json', 'C.json']), p => p === 'B.json' ? { error: 'x' } : { sections: [] }).tabs.map(x => x.path), ['A.json', 'C.json']);
    // 4. Dedup duplicate paths.
    const savedDup = { tabs: [{ path: 'A.json' }, { path: 'A.json' }, { path: 'B.json' }], active: 'A.json' };
    t('assembleRestoredTabs dedups repeated paths',
      assembleRestoredTabs(savedDup, new Set(['A.json', 'B.json']), () => ({ sections: [] })).tabs.map(x => x.path), ['A.json', 'B.json']);
    // 5. Active = saved.active when it survives.
    const savedActive = { tabs: [{ path: 'A.json' }, { path: 'B.json' }, { path: 'C.json' }], active: 'B.json' };
    t('assembleRestoredTabs keeps saved.active when present',
      assembleRestoredTabs(savedActive, new Set(['A.json', 'B.json', 'C.json']), () => ({ sections: [] })).active, 'B.json');
    // 6. Active falls back to last survivor when saved.active was deleted.
    const savedActGone = { tabs: [{ path: 'A.json' }, { path: 'B.json' }, { path: 'C.json' }], active: 'B.json' };
    t('assembleRestoredTabs active falls back to last survivor',
      assembleRestoredTabs(savedActGone, new Set(['A.json', 'C.json']), () => ({ sections: [] })).active, 'C.json');
    // 7. No survivors → { tabs:[], active:null }.
    t('assembleRestoredTabs empty → tabs [] active null',
      assembleRestoredTabs({ tabs: [{ path: 'A.json' }], active: 'A.json' }, new Set(), () => ({ sections: [] })), { tabs: [], active: null });
    // 8. baseMtime lift + _mtime strip + title fallback.
    const savedMt = { tabs: [{ path: 'A.json' }, { path: 'dir/B.json' }], active: 'A.json' };
    const dataA = { title: 'Alpha', sections: [], _mtime: 123 };
    const dataB = { sections: [] }; // no title, no _mtime
    const asm = assembleRestoredTabs(savedMt, new Set(['A.json', 'dir/B.json']), p => p === 'A.json' ? dataA : dataB);
    t('assembleRestoredTabs lifts _mtime → baseMtime', asm.tabs[0].baseMtime, 123);
    t('assembleRestoredTabs strips _mtime from data', dataA._mtime, undefined);
    t('assembleRestoredTabs baseMtime null when _mtime absent', asm.tabs[1].baseMtime, null);
    t('assembleRestoredTabs title falls back to nameFromPath', asm.tabs[1].title, 'B');
  }

  // qparam
  t('qparam reads key', qparam('a=1&b=two', 'b'), 'two');
  t('qparam decodes', qparam('path=a%2Fb.json', 'path'), 'a/b.json');
  t('qparam missing → empty', qparam('a=1', 'z'), '');

  // sectionContent: legacy single-tab is flattened
  const legacy = { tabs: [{ blocks: [{code:'x'}], subsections: [] }] };
  t('sectionContent reads legacy tabs.blocks', sectionContent(legacy).blocks.length, 1);
  const legacyMulti = { tabs: [{ blocks:[{code:'a'}], subsections:[] }, { blocks:[{code:'b'}], subsections:[] }] };
  t('sectionContent folds extra tabs', sectionContent(legacyMulti).blocks.length, 2);
  const flat = { blocks: [{code:'y'}], subsections: [] };
  t('sectionContent passes flat through', sectionContent(flat).blocks.length, 1);

  // blockMatches
  t('blockMatches by code', blockMatches({code:'SELECT Id', type:'sql'}, 'select'), true);
  t('blockMatches by lang label', blockMatches({code:'', type:'javascript'}, 'javascript'), true);
  t('blockMatches negative', blockMatches({code:'abc', type:'sql'}, 'zzz'), false);

  // tree helpers (offline cache mutation primitives)
  const tree = [
    { type:'folder', name:'f', path:'f', children:[
      { type:'page', name:'p', path:'f/p.json', tags:[], langs:[] }
    ]},
    { type:'page', name:'root', path:'root.json', tags:[], langs:[] }
  ];
  t('findInTree nested', !!findInTree(tree, 'f/p.json'), true);
  t('findInTree miss', findInTree(tree, 'nope'), null);
  const tree2 = JSON.parse(JSON.stringify(tree));
  removeFromTree(tree2, 'f/p.json');
  t('removeFromTree removes nested', findInTree(tree2, 'f/p.json'), null);
  const folder = JSON.parse(JSON.stringify(tree))[0];
  rePath(folder, 'renamed');
  t('rePath updates self', folder.path, 'renamed');
  t('rePath updates descendants', folder.children[0].path, 'renamed/p.json');

  // collectRepathPairs: the {old, neu} key pairs a rePath(node, newPath) will produce,
  // captured BEFORE rePath mutates node.path so the OTHER caches (cached page content +
  // per-page local history) can be re-keyed from the old paths. Mirrors rePath's descent.
  const rpNode = JSON.parse(JSON.stringify(tree))[0]; // fresh { path:'f', children:[ 'f/p.json' ] }
  const rpPairs = collectRepathPairs(rpNode, 'renamed');
  t('collectRepathPairs pairs old→new for folder + descendants',
    rpPairs.map(p => [p.old, p.neu]), [['f', 'renamed'], ['f/p.json', 'renamed/p.json']]);
  t('collectRepathPairs computed against PRE-mutation paths (node untouched)', rpNode.path, 'f');

  // collectMatchingPages
  t('collectMatchingPages finds by name', collectMatchingPages(tree, 'root', []).map(p=>p.path), ['root.json']);

  // pageToMarkdown
  const md = pageToMarkdown({ title:'T', sections:[{ title:'S', tags:['a'], blocks:[{type:'sql',label:'L',code:'SELECT 1'}], subsections:[] }] });
  t('pageToMarkdown has title', md.includes('# T'), true);
  t('pageToMarkdown has fenced block', md.includes('```sql') && md.includes('SELECT 1'), true);

  // langLabel / langColor
  t('langLabel known', langLabel('javascript'), 'JavaScript');
  t('langColor stable', langColor('soql'), langColor('soql'));

  // buildMergeBar (shared section/block merge control)
  (function () {
    const target = document.createElement('div');
    const checks = [];
    let merged = null;
    const { bar, syncSelectAll } = buildMergeBar({
      label: '⛶ X', mergingClass: 'merging', target, checks, noun: 'blocks',
      onMerge: (c) => { merged = c; },
    });
    t('buildMergeBar returns a .merge-bar', bar.classList.contains('merge-bar'), true);
    t('buildMergeBar start label', bar.querySelector('button').textContent, '⛶ X');
    t('buildMergeBar exposes syncSelectAll', typeof syncSelectAll, 'function');
    bar.querySelector('button').click(); // start selecting
    t('buildMergeBar start adds mergingClass', target.classList.contains('merging'), true);
    checks.push({ cb: { checked: true }, idx: 0 }, { cb: { checked: true }, idx: 2 });
    bar.querySelector('.merge-do').click();
    t('buildMergeBar passes sorted chosen indices', merged, [0, 2]);
  })();

  // mergeBlocksAndSubs (unified block + subsection merge)
  (function () {
    const _rp = window.renderPage, _ss = window.scheduleSave, _ts = window.toast;
    window.renderPage = () => {}; window.scheduleSave = () => {}; window.toast = () => {};
    try {
      // blocks-only → join code into the topmost selected block
      const blocks = [{ code: 'A' }, { code: 'B' }, { code: 'C' }];
      mergeBlocksAndSubs([0, 2], [], blocks, []);
      t('merge blocks-only joins code into topmost', blocks.map(b => b.code), ['A\n\nC', 'B']);

      // mixed → selected block moves into the topmost selected subsection
      const b2 = [{ code: 'A', label: 'A' }, { code: 'B', label: 'B' }];
      const subX = { title: 'X', blocks: [{ label: 'SX' }], subsections: [] };
      const s2 = [subX, { title: 'Y', blocks: [], subsections: [] }];
      mergeBlocksAndSubs([0], [0], b2, s2);
      t('merge mixed removes block from parent', b2.map(b => b.label), ['B']);
      t('merge mixed prepends block into target sub', subX.blocks.map(b => b.label), ['A', 'SX']);
      t('merge mixed keeps subsection count', s2.length, 2);

      // subs-only → fold others into the topmost selected subsection
      const subA = { title: 'A', blocks: [{ label: 'SA' }], subsections: [] };
      const subB = { title: 'B', blocks: [{ label: 'SB' }], subsections: [{ title: 'BB' }] };
      const s3 = [subA, subB];
      mergeBlocksAndSubs([], [0, 1], [], s3);
      t('merge subs-only reduces to one subsection', s3.map(s => s.title), ['A']);
      t('merge subs-only folds blocks in', subA.blocks.map(b => b.label), ['SA', 'SB']);
      t('merge subs-only folds subsections in', subA.subsections.map(s => s.title), ['BB']);
    } finally {
      window.renderPage = _rp; window.scheduleSave = _ss; window.toast = _ts;
    }
  })();

  // lineDiff (history diff viewer engine)
  t('lineDiff equal → all same', lineDiff('a\nb', 'a\nb').every(r => r.type === 'same'), true);
  (function () {
    const d = lineDiff('a\nb\nc', 'a\nB\nc\nd');
    t('lineDiff finds the deletion', d.some(r => r.type === 'del' && r.text === 'b'), true);
    t('lineDiff finds the change-add', d.some(r => r.type === 'add' && r.text === 'B'), true);
    t('lineDiff appends trailing add', d[d.length - 1].text, 'd');
  })();

  // renderMarkdown / renderInlineMd (note blocks)
  t('md renders heading', renderMarkdown('# Hi').includes('<h1'), true);
  t('md renders bold', renderInlineMd('a **b** c').includes('<strong>b</strong>'), true);
  t('md renders inline code', renderInlineMd('x `y` z').includes('<code>y</code>'), true);
  t('md renders list item', renderMarkdown('- one').includes('<li>one</li>'), true);
  t('md fenced code carries lang class', renderMarkdown('```sql\nSELECT 1\n```').includes('language-sql'), true);
  t('md escapes raw html', renderMarkdown('<b>x</b>').includes('&lt;b&gt;'), true);
  t('md broken wikilink → dim span', renderInlineMd('see [[NoSuchPage]]').includes('xlink broken'), true);
  // full CommonMark + GFM (via vendored markdown-it)
  t('md renders GFM table', /<table[\s\S]*<th[\s\S]*<td/.test(renderMarkdown('| a | b |\n| :--- | ---: |\n| 1 | 2 |')), true);
  t('md table alignment', renderMarkdown('| a |\n| :-: |\n| 1 |').includes('text-align:center'), true);
  t('md lone pipe line stays paragraph', renderMarkdown('| not | a table |').includes('<table'), false);
  t('md strikethrough', renderInlineMd('~~gone~~').includes('<s>gone</s>'), true);
  t('md underscore italic', renderInlineMd('an _em_ word').includes('<em>em</em>'), true);
  t('md intra-word underscore stays literal', renderInlineMd('my_var_name').includes('<em>'), false);
  t('md underscore strong', renderInlineMd('__bold__').includes('<strong>bold</strong>'), true);

  // mergeHtmlProject — THE normative merge rule. The pinned case is H-1: a merge upload

  (function () {
    const ex = { entry: 'index.html', code: 'OLD-ENTRY', files: [{ p: 'style.css', t: 'A' }, { p: 'old.js', t: 'keep' }] };
    const inc = { entry: 'home.html', code: 'NEW-ENTRY', files: [{ p: 'style.css', t: 'B' }] };

    // INVARIANT: entry must never ALSO sit in files[] — htmlFileList would drop it from
    // the list while it persisted in the stored JSON.
    const notInFiles = (r) => r.files.every(f => f.p !== r.entry);
    t('merge: entry never appears in files (displaced branch)', notInFiles(m), true);

    t('merge: same entry path ⇒ code is the incoming text', same.code, 'FRESH');
    t('merge: same entry path leaves no duplicate record', same.files.filter(f => f.p === 'index.html').length, 0);
    t('merge: entry never appears in files (replaced branch)', notInFiles(same), true);

    // incoming carries a FILE at the old entry's path AND a different entry: the file
    // overwrite happens first, so it is `replaced` — deterministic and documented.
    const both = mergeHtmlProject(ex, { entry: 'home.html', code: 'N', files: [{ p: 'index.html', t: 'FROM-UPLOAD' }] });
    t('merge: file at the old entry path ⇒ replaced, not displaced', [both.replaced, both.displaced], [['index.html'], []]);
    t('merge: that file\'s incoming text wins', (both.files.find(f => f.p === 'index.html') || {}).t, 'FROM-UPLOAD');

    // merge into an EMPTY block is byte-identical to replace: no prompts, no lists
    const intoEmpty = mergeHtmlProject({ entry: '', code: '', files: [] }, inc);
    t('merge into empty ⇒ equals the incoming project', [intoEmpty.entry, intoEmpty.code], ['home.html', 'NEW-ENTRY']);
    t('merge into empty ⇒ nothing replaced or displaced', [intoEmpty.replaced, intoEmpty.displaced], [[], []]);
    // `added` lists every path the project didn't have — the new entry included
    t('merge into empty ⇒ every incoming path is `added`', intoEmpty.added, ['style.css', 'home.html']);

    // A BRAND-NEW block is {entry:'index.html', code:''} — that placeholder must not
    // make the FIRST upload look like it overwrites a file (regression: a spurious
    // "overwrites 1 file: index.html" confirm on every new block's first upload).
    const fresh = mergeHtmlProject({ entry: 'index.html', code: '', files: [] },
      { entry: 'index.html', code: 'FIRST', files: [{ p: 'style.css', t: 'x' }] });
    t('merge into a NEW block reports nothing replaced', fresh.replaced, []);
    t('merge into a NEW block reports nothing displaced', fresh.displaced, []);
    t('merge into a NEW block takes the incoming entry text', fresh.code, 'FIRST');
    // …and an empty placeholder entry is never demoted into files either
    const freshDiff = mergeHtmlProject({ entry: 'index.html', code: '', files: [] },
      { entry: 'home.html', code: 'FIRST', files: [] });
    t('an empty placeholder entry is not demoted into files', freshDiff.files, []);
    t('an empty placeholder entry is not reported as displaced', freshDiff.displaced, []);

    // ordering is deterministic: incoming upload order first, then existing survivors
    t('merge: incoming order first, then existing survivors',
      m.files.map(f => f.p), ['style.css', 'old.js', 'index.html']);
    t('merge: repeated calls are stable',
      JSON.stringify(mergeHtmlProject(ex, inc)), JSON.stringify(m));

    // paths normalized ⇒ './a.css' and 'a.css' are ONE record, not two
    const norm = mergeHtmlProject({ entry: 'i.html', code: 'x', files: [{ p: 'a.css', t: '1' }] },

    t('merge(null, null) is well-formed empty', mergeHtmlProject(null, null), empty);

    t('merge never throws on garbage', (() => {

  // ---- async: offline trash/history reducers (drive the real IndexedDB code) ----
  // These touch the same 'codeman' DB the app uses, so snapshot the real cache
  // first and restore it in `finally` — opening this page never corrupts data.
  (async () => {
    const snap = {};
    const savedQueue = syncQueue.slice();
    function ta(name, got, want) {
      const ok = JSON.stringify(got) === JSON.stringify(want);
      ok ? pass++ : fail++;
      const d = document.createElement('div');
      d.className = 'row ' + (ok ? 'pass' : 'fail');
      d.textContent = (ok ? '✓ ' : '✗ ') + name + (ok ? '' : `  →  got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);
      out.appendChild(d);
    }
    try {
      // debounce: trailing-edge coalescing of a burst into one call; cancel() drops a
      // pending call. Real timers (short) — the search/resize coalescing rides this.
      await new Promise(resolve => {
        let n = 0;
        const d = debounce(() => { n++; }, 20);
        d(); d(); d();                             // three rapid calls
        ta('debounce does not fire synchronously', n, 0);
        setTimeout(() => {
          ta('debounce coalesces a burst into one call', n, 1);
          let m = 0;
          const d2 = debounce(() => { m++; }, 20);
          d2(); d2.cancel();                       // cancelled before it fires
          setTimeout(() => { ta('debounce cancel drops the pending call', m, 0); resolve(); }, 40);
        }, 40);
      });

      // ---- apiFetch / api(): the network classification contract -----------------
      // apiFetch is stubbed out everywhere ELSE in this suite, so its two hard
      // guarantees — "offline never latches" (a 4xx or a malformed body is a SERVER
      // response, not a connectivity loss) and "a wrong password is never persisted" —
      // had zero coverage. Drive the real functions against a scripted window.fetch,
      // with api()'s two side-effecting collaborators neutralised so the classification
      // is observable without touching the badge, the probe loop or the real cache.
      {
        const realFetch = window.fetch, realPrompt = window.promptAuth;
        const realSetOffline = window.setOffline, realOfflineApi = window.offlineApi;
        const realCache = window.cacheOnSuccess;
        let tokenSnap = null;
        try { tokenSnap = localStorage.getItem('codeman.authToken'); } catch (e) {}
        let offlineCalls = [];
        window.setOffline = (on) => { offlineCalls.push(on); };
        window.offlineApi = async () => ({ _fromOffline: true });
        window.cacheOnSuccess = async () => {};
        // a scripted Response: json() throws on a body that isn't JSON, like the real one
        const res = (status, bodyText) => Promise.resolve({
          status, ok: status < 400, json: async () => JSON.parse(bodyText),
        });
        try {
          // (a) a reachable server answering 4xx is an APP error, never "offline".
          window.fetch = () => res(400, '{"error":"nope"}');
          offlineCalls = [];
          ta('apiFetch surfaces a 4xx body instead of throwing', await api('list_tags'), { error: 'nope' });
          ta('a 4xx does NOT trip offline', offlineCalls.includes(true), false);

          // (b) a 200 whose body won't parse (a stray PHP notice) is _transient —
          // flushQueue retries it a few times rather than parking or latching offline.
          window.fetch = () => res(200, 'PHP Notice: x\n{"ok":true}');
          offlineCalls = [];
          const mal = await apiFetch('tree');
          ta('a malformed 200 body is tagged _transient', mal._transient, true);
          ta('a malformed 200 body reports the status', /malformed server response \(200\)/.test(mal.error || ''), true);
          await api('list_tags');
          ta('a malformed body does NOT trip offline', offlineCalls.includes(true), false);

          // (c) a 5xx IS a backend failure → throws → api() goes offline.
          window.fetch = () => res(503, 'gateway');
          offlineCalls = [];
          ta('a 5xx falls back to the offline mirror', await api('tree'), { _fromOffline: true });
          ta('a 5xx trips offline', offlineCalls.includes(true), true);

          // (d) a timed-out/aborted request (the AbortController path) is a real
          // connectivity loss: apiFetch throws and api() serves the mirror.
          window.fetch = () => Promise.reject(Object.assign(new Error('aborted'), { name: 'AbortError' }));
          offlineCalls = [];
          let threw = false;
          try { await apiFetch('tree'); } catch (e) { threw = true; }
          ta('an aborted (timed-out) request throws from apiFetch', threw, true);
          ta('a timeout falls back to the offline mirror', await api('tree'), { _fromOffline: true });
          ta('a timeout trips offline', offlineCalls.includes(true), true);

          // (e) 401 → prompt → still 401 ⇒ the entered secret was WRONG. It must not be
          // persisted, or every later request replays it and the user can never re-enter.
          try { localStorage.setItem('codeman.authToken', 'wrongsecret'); } catch (e) {}
          window.promptAuth = async () => true;      // pretend the user typed a password
          let calls = 0;
          window.fetch = () => { calls++; return res(401, '{"error":"auth","auth":true}'); };
          let authErr = null;
          try { await apiFetch('tree'); } catch (e) { authErr = e.message; }
          ta('a persistent 401 throws (never treated as offline)', authErr, 'authentication required');
          ta('the 401 is retried exactly once after the prompt', calls, 2);
          let stored = 'unread';
          try { stored = localStorage.getItem('codeman.authToken'); } catch (e) {}
          ta('a wrong password is NOT persisted', stored, null);
        } finally {
          window.fetch = realFetch; window.promptAuth = realPrompt;
          window.setOffline = realSetOffline; window.offlineApi = realOfflineApi;
          window.cacheOnSuccess = realCache;
          try {
            if (tokenSnap === null) localStorage.removeItem('codeman.authToken');
            else localStorage.setItem('codeman.authToken', tokenSnap);
          } catch (e) {}
        }
      }

      // The offline cache is namespaced per server (offline.js): go through the SAME
      // kvGet/kvSet/pageGet/pageSet wrappers the functions use, so we seed/read the
      // active namespace AND snapshot/restore exactly the keys under test (safe to run).

          currentPagePath = RUN + 'rich/Big.json';
          pageDirty.clear();
          const big = '<p>' + 'a'.repeat(RICH_SOFT_WARN + 64) + '</p>';
          const b = { rich: true, type: 'rich', label: '', code: big };
          blockBackups.set(b, big);
          const bel = renderBlock(b, [b], 0);
          const surface = bel.querySelector('.rich-surface');
          surface.dispatchEvent(new Event('input', { bubbles: true }));
          surface.dispatchEvent(new Event('input', { bubbles: true }));
          ta('an oversized rich block warns exactly ONCE per session',
             toasts.filter(m => m.includes('rich block')).length, 1);
          ta('the oversize warning never truncates the stored HTML', b.code.length > RICH_SOFT_WARN, true);
          blockBackups.delete(b); bel.remove();
        } finally {
          window.toast = _toast; currentPagePath = _cpp;
          pageDirty.clear();
          if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
        }
      }

      // ---- .modal-title honours \n (the over-cap rejection's file list) ------------
      // A modal message is a plain string, and one caller passes a \n-separated list of
      // oversized files. `pre-line` is what keeps those line breaks. Asserted on the
      // COMPUTED style against the real stylesheet, loaded (and removed) just for this.
      {
        const link = document.createElement('link');
        link.rel = 'stylesheet'; link.href = 'style.css';
        await new Promise((resolve) => { link.onload = resolve; link.onerror = resolve; document.head.appendChild(link); });
        const probe = document.createElement('div');
        probe.className = 'modal-title';
        document.body.appendChild(probe);
        const ws = getComputedStyle(probe).whiteSpace;
        probe.remove(); link.remove();
        ta('.modal-title keeps newlines (white-space: pre-line)', ws, 'pre-line');
      }

      // importPages negatives: malformed / wrong-shape input fails gracefully —
      // error surfaced via toast, no crash, nothing imported. The hidden file
      // input is captured via a createElement shim; its click() is stubbed so no
      // real file picker opens.
      {
        const _create = document.createElement, _click = HTMLInputElement.prototype.click,
              _toast = window.toast, _load = window.loadTree;
        try {
          let lastInput = null; const toasts = [];
          document.createElement = function (tag, ...rest) {
            const el = _create.call(document, tag, ...rest);
            if (String(tag).toLowerCase() === 'input') lastInput = el;
            return el;
          };
          HTMLInputElement.prototype.click = function () {};
          window.toast = (m) => { toasts.push(String(m)); };
          window.loadTree = async () => {};
          const runImport = async (text, name) => {
            toasts.length = 0;
            importPages();
            Object.defineProperty(lastInput, 'files', { value: [new File([text], name)], configurable: true });
            await lastInput.onchange();
            return toasts.slice();
          };
          ta('importPages malformed JSON → error toast, no crash', await runImport('{oops', 'bad.json'), ['Invalid JSON']);
          ta('importPages wrong-shape object → imports 0, no crash', await runImport('{"foo":1}', 'x.json'), ['Imported 0 pages']);
          ta('importPages bundle of junk values → imports 0, no crash', await runImport('{"a":null,"b":[1],"c":{"sections":"nope"}}', 'y.json'), ['Imported 0 pages']);
          ta('importPages falsy-but-valid JSON (null) → error toast, no crash', await runImport('null', 'z.json'), ['Invalid JSON']);
        } finally {
          document.createElement = _create; HTMLInputElement.prototype.click = _click;
          window.toast = _toast; window.loadTree = _load;
        }
      }

      // ---- a malformed `tree` response must never poison treeData -------------------
      // api() routes to the IndexedDB mirror only when apiFetch THROWS. A *reachable*
      // server answering 200 with {error:…}/null/a string sailed straight through
      // setTreeData: the library rendered as the EMPTY onboarding state, the offline
      // mirror was BYPASSED, and the next navigation threw
      // "folderChildren(...).find is not a function". setTreeData is now the shape guard
      // (covering all five writers) and loadTree treats a bad shape as a failure.
      {
        const _api = window.api, _offlineApi = window.offlineApi, _setOffline = window.setOffline,
              _renderTree = window.renderTree, _toast = window.toast, _colSort = colSort;
        const goodTree = [{ type: 'folder', name: 'F', path: 'F', project: false, children: [
          { type: 'page', name: 'P', path: 'F/P.json', tags: [], langs: [] }] }];
        try {
          const toasts = []; let offlineFlags = [];
          window.renderTree = () => {};                  // no sidebar paint in the harness
          window.toast = (m) => toasts.push(String(m));
          window.setOffline = (on) => { offlineFlags.push(on); };
          window.offlineApi = async (action) => (action === 'tree' ? goodTree : {});

          // (a) the choke-point guard: every non-array shape is REJECTED, the last good
          //     tree survives, and the rejection is REPORTED so a caller can fall back.
          setTreeData(goodTree);
          const shapes = [{}, null, undefined, 'nope', 42, { error: 'boom' }];
          ta('setTreeData rejects every non-array shape', shapes.map(s => setTreeData(s)), shapes.map(() => false));
          ta('a rejected write keeps the last good tree', treeData, goodTree);
          ta('setTreeData still accepts (and confirms) a real array', setTreeData([]), true);

          // (b) loadTree on a malformed response: mirror consulted, library NOT empty,
          //     offline flagged (starts the self-healing probe), and the user told.
          setTreeData([]); offlineFlags = []; toasts.length = 0;
          window.api = async (a) => (a === 'tree'
            ? { error: 'malformed server response (200)', _transient: true } : {});
          await loadTree();
          ta('loadTree falls back to the offline mirror on a malformed tree', treeData, goodTree);
          ta('a malformed tree does NOT render an empty library', treeData.length, 1);
          ta('a malformed tree flags offline', offlineFlags.includes(true), true);
          ta('a malformed tree tells the user instead of failing silently', toasts.length, 1);

          // (c) …and the crash itself: navigating the poisoned tree used to throw.
          let threw = null;
          try { nodeAtPath('F/P.json'); folderChildren('F'); projectChain('F/P.json'); }
          catch (e) { threw = String(e && e.message); }
          ta('navigation after a malformed tree does not throw', threw, null);

          // (d) nothing cached either (a poisoned/empty mirror): still a usable array.
          window.offlineApi = async () => null;
          setTreeData([]);
          await loadTree();
          ta('an empty mirror + a malformed tree still leaves treeData an array', Array.isArray(treeData), true);
        } finally {
          window.api = _api; window.offlineApi = _offlineApi; window.setOffline = _setOffline;
          window.renderTree = _renderTree; window.toast = _toast;
          colSort = _colSort; setTreeData([]);
        }
      }

      // ---- …and cacheOnSuccess must not POISON the mirror it is the fallback for ----
      // loadTree's fallback is worthless if the mirror is already garbage by the time it
      // reads it: api() runs cacheOnSuccess BEFORE returning, and apiFetch RESOLVES on a
      // reachable server's 4xx / a malformed 200 — so the unguarded `kvSet('tree', data)`
      // overwrote a GOOD mirror first. Found live (the library still went empty WITH the
      // loadTree fallback in place), so it is asserted against the real kv store.
      {
        const _fetch = window.fetch, _setOffline = window.setOffline, _renderTree = window.renderTree;
        const goodTree = [{ type: 'folder', name: 'M', path: 'M', children: [] }];
        try {
          window.setOffline = () => {}; window.renderTree = () => {};
          const res = (status, bodyText) => Promise.resolve({
            status, ok: status < 400, json: async () => JSON.parse(bodyText),
          });
          await kvSet('tree', goodTree);
          window.fetch = () => res(200, '<br />Warning: oops<br />[]');   // unparseable body
          await api('tree');
          ta('a malformed tree response leaves the kv mirror INTACT', await kvGet('tree'), goodTree);
          window.fetch = () => res(400, '{"error":"nope"}');              // reachable 4xx
          await api('tree');
          ta('a 4xx tree response leaves the kv mirror INTACT', await kvGet('tree'), goodTree);
          window.fetch = () => res(200, 'null');                          // 200, wrong shape
          await api('tree');
          ta('a null tree response leaves the kv mirror INTACT', await kvGet('tree'), goodTree);
          window.fetch = () => res(200, '{"error":"nope"}');               // 200 + error body
          await api('get_page', undefined, 'path=' + encodeURIComponent(RUN + 'mirror/P.json'));
          ta('an error get_page response is not mirrored as a page',
             await pageGet(RUN + 'mirror/P.json'), undefined);
          window.fetch = () => res(200, '[]');                             // 200, wrong shape
          await api('get_page', undefined, 'path=' + encodeURIComponent(RUN + 'mirror/Arr.json'));
          ta('an array-shaped get_page response is not mirrored as a page',
             await pageGet(RUN + 'mirror/Arr.json'), undefined);
          // RV-2: guard strictness is proportional to blast radius. An odd-but-VALID page
          // (hand-written / imported, no `sections` array) is NOT an error body — demanding
          // sections made it permanently uncacheable, so primeOfflineCache skipped it and it
          // rendered BLANK offline with no warning. It must still be mirrored.
          window.fetch = () => res(200, '{"title":"NoSect"}');
          await api('get_page', undefined, 'path=' + encodeURIComponent(RUN + 'mirror/NoSect.json'));
          ta('a page with no sections array IS still mirrored (usable offline)',
             await pageGet(RUN + 'mirror/NoSect.json'), { title: 'NoSect' });
          await pageDel(RUN + 'mirror/NoSect.json');
          window.fetch = () => res(200, '[]');                            // a real array still caches
          await api('tree');
          ta('a VALID tree response still updates the kv mirror', await kvGet('tree'), []);
        } finally {
          window.fetch = _fetch; window.setOffline = _setOffline; window.renderTree = _renderTree;
        }
      }

      // ---- RV-1: a save the SERVER REJECTED must never report success, and the edit
      // must survive a reload ---------------------------------------------------------
      // apiFetch DELIBERATELY resolves a reachable server's 4xx (a 4xx is a real response,
      // not "offline"), so savePage's missing `res.error` branch let an error body fall
      // through to `pageDirty.delete()` + toast('Saved'): measured live — another device
      // deletes the parent folder, the client says "Saved", and after a reload the edit
      // exists NOWHERE. Driven through the REAL savePage/handleSaveConflict against a
      // stubbed api (not the helper), because the missing branch WAS the bug.
      {
        const _api = window.api, _toast = window.toast, _confirm = window.showConfirm;
        const _cpp = currentPagePath, _cpd = currentPageData, _tabs = openPages.slice();
        const toasts = [];
        try {
          window.toast = (m) => { toasts.push(String(m)); };
          const SP = RUN + 'reject/P.json';
          const mkPage = (marker) => ({ title: 'P', sections: [{ title: 'S', blocks: [{ type: 'sql', code: marker }], subsections: [] }] });
          const seed = (marker) => {
            currentPagePath = SP; currentPageData = mkPage(marker);
            openPages.length = 0;
            openPages.push({ path: SP, title: 'P', data: currentPageData, filter: '', baseMtime: 111 });
            pageDirty.clear(); pageDirty.add(SP); toasts.length = 0; syncQueue.length = 0;
          };
          const dlFor = async () => (await dlList()).filter(d => d.action === 'save_page' && d.body && d.body.path === SP);
          // Read a parked/queued op's block text without throwing when it isn't there, so
          // EVERY assertion below reports individually instead of the first missing entry
          // aborting the block (it is the revert→RED signal that has to stay readable).
          const codeOf = (o) => { try { return o.body.data.sections[0].blocks[0].code; } catch (e) { return null; } };

          // (a) terminal 4xx — the measured repro (parent folder deleted elsewhere)
          seed('KEEPME-CRITICALEDIT');
          window.api = async () => ({ error: 'parent folder does not exist' });
          await savePage();
          ta('a REJECTED save never toasts Saved', toasts.some(m => /^Saved/.test(m)), false);
          ta('a rejected save surfaces the server reason', toasts.some(m => /parent folder does not exist/.test(m)), true);
          let dl = await dlFor();
          ta('a rejected save is PARKED as a dead-letter (survives a reload)', dl.length, 1);
          ta('the parked entry carries the EDIT, not the pre-edit content',
             codeOf(dl[0]), 'KEEPME-CRITICALEDIT');
          ta('the parked entry is forced (a replay must not re-conflict)', !!(dl[0] && dl[0].body && dl[0].body.force), true);
          ta('a terminal rejection is classified terminal (not retried forever)', dl[0] && dl[0].kind, 'terminal');
          ta('a terminal rejection does NOT also sit in the retry queue', syncQueue.length, 0);
          ta('the page leaves pageDirty ONLY because the edit is durably parked', pageDirty.has(SP), false);

          // a repeated failure on the SAME page supersedes OUR OWN entry (each is a full
          // page snapshot, so the newest wins) instead of stacking one per autosave burst
          currentPageData.sections[0].blocks[0].code = 'KEEPME-SECOND';
          pageDirty.add(SP);
          await savePage();
          dl = await dlFor();
          ta('a repeated rejection supersedes our own parked entry (one per page)', dl.length, 1);
          ta('…keeping the NEWEST content', codeOf(dl[0]), 'KEEPME-SECOND');
          for (const d of dl) await dlRemove(d.id);

          // (b) transient (a malformed 200 body — core.js tags it _transient) → the write
          // QUEUE, whose policy retries 3× across flush cycles and only THEN parks it.
          seed('KEEPME-TRANSIENT');
          window.api = async () => ({ error: 'malformed server response (200)', _transient: true });
          await savePage();
          ta('a transient rejection never toasts Saved', toasts.some(m => /^Saved/.test(m)), false);
          ta('a transient rejection goes to the retry queue',
             syncQueue.filter(o => o.action === 'save_page' && o.body.path === SP).length, 1);
          ta('a transient rejection carries the edit', codeOf(syncQueue[0]), 'KEEPME-TRANSIENT');
          ta('a transient rejection is NOT parked straight as a dead-letter', (await dlFor()).length, 0);
          syncQueue.length = 0; await saveQueue();

          // (c) the CONFLICT branch is UNCHANGED: still prompts, still resends forced
          seed('CONFLICT-MINE');
          let sent = [];
          window.showConfirm = async () => true;               // "Overwrite"
          window.api = async (a, b) => { sent.push(b); return sent.length === 1 ? { conflict: true, mtime: 777 } : { ok: true, mtime: 888 }; };
          await savePage();
          ta('a conflict still prompts and resends FORCED at the disk mtime',
             [sent.length, !!(sent[1] && sent[1].force), sent[1] && sent[1].baseMtime], [2, true, 777]);
          ta('an overwritten conflict reports the overwrite', toasts, ['Saved (overwrote disk version)']);
          ta('an overwritten conflict clears dirty + adopts the new mtime',
             [pageDirty.has(SP), openPages[0].baseMtime], [false, 888]);
          ta('an overwritten conflict parks nothing', (await dlFor()).length, 0);

          // …and a conflict-force the server STILL rejects is parked, not announced as an
          // overwrite (the same blind spot, on the adjacent code path).
          seed('CONFLICT-REJECTED');
          sent = [];
          window.api = async (a, b) => { sent.push(b); return sent.length === 1 ? { conflict: true, mtime: 777 } : { error: 'parent folder does not exist' }; };
          await savePage();
          ta('a rejected conflict-force never claims an overwrite', toasts.some(m => /^Saved/.test(m)), false);
          dl = await dlFor();
          ta('a rejected conflict-force is parked', dl.length, 1);
          ta('…with the user\'s version', codeOf(dl[0]), 'CONFLICT-REJECTED');
          for (const d of dl) await dlRemove(d.id);
          window.showConfirm = _confirm;

          // (d) the OFFLINE branch is UNCHANGED: a queued write is durable → clears dirty,
          // and baseMtime is dropped (a ghost write must not false-conflict later).
          seed('OFFLINE-EDIT');
          window.api = async () => ({ ok: true, offline: true, mtime: null });
          await savePage();
          ta('an offline-queued save still reports Saved', toasts, ['Saved']);
          ta('an offline-queued save clears dirty and drops baseMtime',
             [pageDirty.has(SP), openPages[0].baseMtime], [false, null]);
          ta('an offline-queued save parks nothing', (await dlFor()).length, 0);

          // (e) a HEALTHY save is untouched: exactly one 'Saved', dirty cleared, mtime kept
          seed('HAPPY-PATH');
          window.api = async () => ({ ok: true, mtime: 222 });
          await savePage();
          ta('a healthy save toasts Saved exactly once', toasts, ['Saved']);
          ta('a healthy save clears dirty and adopts the mtime',
             [pageDirty.has(SP), openPages[0].baseMtime], [false, 222]);
          ta('a healthy save parks nothing', (await dlFor()).length, 0);
        } finally {
          window.api = _api; window.toast = _toast; window.showConfirm = _confirm;
          currentPagePath = _cpp; currentPageData = _cpd;
          openPages.length = 0; openPages.push(..._tabs);
          pageDirty.clear(); syncQueue.length = 0;
          if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
        }
      }

      // openPage dedups concurrent/rapid opens of the SAME path (no duplicate tabs).
      // (Own try/catch so a render hiccup here can't mislabel the offline tests.)
      try {
        const DP = RUN + 'dedup/A.json';
        openPages.length = 0;
        await Promise.all([openPage(DP), openPage(DP), openPage(DP)]);
        ta('openPage dedups concurrent opens of same path', openPages.filter(t => t.path === DP).length, 1);
        await openPage(DP); // re-opening an already-open page focuses the existing tab
        ta('openPage re-open focuses existing tab', openPages.filter(t => t.path === DP).length, 1);
        openPages.length = 0;
        await pageDel(DP); // drop the cached page seeded by the stubbed get_page
      } catch (e2) {
        fail++; const d2 = document.createElement('div'); d2.className = 'row fail';
        d2.textContent = '✗ openPage dedup test threw: ' + (e2 && e2.message); out.appendChild(d2);
      }
    } catch (e) {
      fail++;
      const d = document.createElement('div'); d.className = 'row fail';
      d.textContent = '✗ offline reducer tests threw: ' + (e && e.message);
      out.appendChild(d);
    } finally {
      // restore the real cache exactly as it was
      for (const k of ['tree', 'queue', 'trash', 'history', '__history_migrated']) {
        if (snap[k] !== undefined) await kvSet(k, snap[k]); else await kvDel(k);
      }
      // remove any dl: entries this run created, then restore the snapshotted originals
      try {
        for (const r of await kvEnumerate('dl:')) await kvDel(r.key);
        for (const r of dlSnap) await kvSet(r.key, r.value);
      } catch (e) {}
      // same for per-page history:<path> keys (remove this run's, restore originals)
      try {
        for (const r of await kvEnumerate('history:')) await kvDel(r.key);
        for (const r of histSnap) await kvSet(r.key, r.value);
      } catch (e) {}
      syncQueue.length = 0; syncQueue.push(...savedQueue);
      document.getElementById('summary').innerHTML =
        `<span class="${fail ? 'fail' : 'pass'}">${pass} passed, ${fail} failed</span>`;
      window.__testResult = { pass, fail, done: true };
    }
  })();
</script>
</body>
</html>
